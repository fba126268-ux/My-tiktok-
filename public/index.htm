<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiktok monetisation </title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>Welcome</h1>

      <div class="tabs">
        <button id="loginTab" class="active">Login</button>
        
      </div>

      <form id="loginForm">

        <input
          type="text"
          id="loginUsername"
          placeholder="Username"
          required
        >

        <input
          type="password"
          id="loginPassword"
          placeholder="Password"
          required
        >

        <button type="submit">
          Login
        </button>

      </form>

      <p id="message"></p>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
